<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задания — KanjiZen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { zen: { 50:'#fcfbfa',100:'#f5f2ec',200:'#ebe5da',300:'#d9cfbe',400:'#b8a68c',500:'#947e61',600:'#7a6448',700:'#5c4b35',800:'#3d3122',900:'#221b12' },
                          accent: { 500:'#d97706', 600:'#b45309' } },
                fontFamily: { sans: ['Inter','sans-serif'], jp: ['Noto Sans JP','sans-serif'] } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>.zen-gradient { background: linear-gradient(135deg, #3d3122 0%, #5c4b35 100%); }</style>
</head>
<body class="min-h-full bg-zen-100/70 text-zen-800 font-sans">

    <header class="zen-gradient text-white shadow-xl">
        <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-white/10 border border-white/25 flex items-center justify-center font-black text-amber-100 font-jp">漢字</div>
                <div>
                    <h1 class="font-extrabold text-amber-50 leading-tight">KanjiZen</h1>
                    <p class="text-[11px] text-amber-100/70">Задания JLPT</p>
                </div>
            </a>
            <a href="/" class="text-xs text-amber-100 hover:text-white">← Справочник</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-8 space-y-6">
        <div id="message" class="bg-white border border-zen-200/80 rounded-3xl p-6 text-center text-sm text-zen-500">Загружаем...</div>
        <div id="tasks" class="space-y-6"></div>
    </main>

    <script>
        const sb = supabase.createClient(
            'https://stnxwbuozduhphftfqri.supabase.co',
            'sb_publishable_sev2FLO_oLbIoLIWEwyXzw_l_N52RzS'
        );
        const msg = document.getElementById('message');
        const box = document.getElementById('tasks');

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function renderTask(t, idx) {
            const opts = t.options.map((o, i) => `
                <label class="flex items-center gap-3 p-3 rounded-2xl border border-zen-200 hover:border-amber-500/70 cursor-pointer">
                    <input type="radio" name="q${t.id}" value="${esc(o)}" class="accent-amber-600">
                    <span class="font-jp">${esc(o)}</span>
                </label>`).join('');
            return `
                <div class="bg-white border border-zen-200/80 rounded-3xl p-6 shadow-sm" data-id="${t.id}" data-answer="${esc(t.answer)}">
                    <p class="text-xs text-zen-400 mb-2">Уровень ${esc(t.level)} · вопрос ${idx + 1}</p>
                    <h3 class="font-semibold text-lg mb-4">${esc(t.question)}</h3>
                    <div class="space-y-2">${opts}</div>
                    <div class="mt-4 flex items-center gap-3">
                        <button onclick="checkTask(${t.id})" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl">Проверить</button>
                        <span id="res${t.id}" class="text-sm font-semibold"></span>
                    </div>
                </div>`;
        }

        function checkTask(id) {
            const card = document.querySelector(`[data-id="${id}"]`);
            const chosen = card.querySelector('input:checked');
            const res = document.getElementById('res' + id);
            if (!chosen) { res.className = 'text-sm font-semibold text-zen-500'; res.innerText = 'Выберите ответ'; return; }
            const ok = chosen.value === card.dataset.answer;
            res.className = 'text-sm font-semibold ' + (ok ? 'text-green-700' : 'text-red-600');
            res.innerText = ok ? 'Верно!' : 'Неверно. Правильный ответ: ' + card.dataset.answer;
        }

        const LEVELS = ['N5', 'N4', 'N3', 'N2', 'N1'];

        function lockedCard(level, n) {
            const bar = w => `<div class="h-3 rounded bg-zen-200 mb-3" style="width:${w}%"></div>`;
            return `
                <div class="relative bg-white border border-zen-200/80 rounded-3xl p-6 overflow-hidden">
                    <div class="blur-sm select-none pointer-events-none">
                        <p class="text-xs text-zen-400 mb-3">Уровень ${level}</p>
                        ${bar(80)}${bar(60)}
                        <div class="grid grid-cols-2 gap-2 mt-4">
                            <div class="h-10 rounded-2xl bg-zen-100"></div><div class="h-10 rounded-2xl bg-zen-100"></div>
                            <div class="h-10 rounded-2xl bg-zen-100"></div><div class="h-10 rounded-2xl bg-zen-100"></div>
                        </div>
                    </div>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-white/70">
                        <p class="font-bold text-zen-900 mb-1">Заблокировано</p>
                        <p class="text-sm text-zen-500 mb-4">Ещё ${n} заданий уровня ${level}</p>
                        <button disabled class="px-5 py-2.5 bg-zen-300 text-white font-semibold rounded-xl cursor-not-allowed">Купить уровень — скоро</button>
                    </div>
                </div>`;
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();

            let owned = [];
            if (session) {
                const { data: purchases, error: pErr } = await sb.from('purchases').select('level');
                if (pErr) { msg.innerText = 'Ошибка: ' + pErr.message; return; }
                owned = purchases.map(p => p.level);
            }

            // Бесплатные задания видны всем, платные — только купившим уровень (это решает база)
            const { data: tasks, error: tErr } = await sb.from('tasks').select('*').order('id');
            if (tErr) { msg.innerText = 'Ошибка: ' + tErr.message; return; }

            const { data: counts } = await sb.from('level_counts').select('*');
            const countOf = lvl => ((counts || []).find(c => c.level === lvl) || {}).total || 0;

            msg.innerHTML = session
                ? `Открытые уровни: ${owned.length ? owned.join(', ') : 'пока нет'}. Остальные уровни можно посмотреть ниже.`
                : 'Бесплатные задания доступны всем. Чтобы открыть остальные, <a href="login.html" class="text-amber-700 font-semibold underline">войдите в аккаунт</a>.';

            let html = '';
            LEVELS.forEach(level => {
                const lt = tasks.filter(t => t.level === level);
                const total = countOf(level);
                if (!lt.length && !total) return;

                html += `<h2 class="text-lg font-bold text-zen-900 pt-2">Уровень ${level}</h2>`;
                if (owned.includes(level)) {
                    html += lt.map(renderTask).join('');
                } else {
                    const free = lt.filter(t => t.is_free);
                    html += free.map(renderTask).join('');
                    const locked = total - free.length;
                    if (locked > 0) html += lockedCard(level, locked);
                }
            });
            box.innerHTML = html || '<p class="text-sm text-zen-500">Задания пока не добавлены.</p>';
        }

        init();
    </script>
</body>
</html>
