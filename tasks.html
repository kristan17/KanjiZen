<script>
const sb = supabase.createClient('https://stnxwbuozduhphftfqri.supabase.co', 'sb_publishable_sev2FLO_oLbIoLIWEwyXzw_l_N52RzS');
const LEVELS = ['N5', 'N4', 'N3', 'N2', 'N1'];
const CAT_NAME = { kanji: 'Кандзи', grammar: 'Грамматика', reading: 'Чтение' };
const view = document.getElementById('view');
let activeLevel = 'N5', activeCat = 'kanji', owned = [], run = null;

// ----- Банк тестов (бесплатные). Каждый тест — 10 вопросов. -----
const Q = (q, o, a) => ({ q, o, a });
const BANK = {
    'N5|kanji': [[
        Q('Как читается 山?', ['やま', 'さん', 'かわ', 'たけ'], 'やま'),
        Q('Какое значение у 水?', ['огонь', 'вода', 'дерево', 'земля'], 'вода'),
        Q('Какое значение у 木?', ['дерево', 'вода', 'огонь', 'солнце'], 'дерево'),
        Q('Какое значение у 人?', ['человек', 'гора', 'рука', 'дождь'], 'человек'),
        Q('Как читается 月 (луна)?', ['つき', 'ひ', 'き', 'くち'], 'つき'),
        Q('Какое значение у 口?', ['рот', 'рука', 'нога', 'глаз'], 'рот'),
        Q('Какое значение у 目?', ['глаз', 'ухо', 'рот', 'нос'], 'глаз'),
        Q('Как читается 大 (большой)?', ['おお', 'ちい', 'なか', 'した'], 'おお'),
        Q('Какое значение у 小?', ['маленький', 'большой', 'длинный', 'новый'], 'маленький'),
        Q('Какое значение у 上?', ['верх', 'низ', 'середина', 'перед'], 'верх')
    ]],
    'N5|grammar': [[
        Q('わたしは学生___。', ['です', 'ます', 'ました', 'でした'], 'です'),
        Q('これは本___。', ['です', 'ます', 'ました', 'でした'], 'です'),
        Q('毎日学校___。', ['に行きます', 'を行きます', 'で行きます', 'は行きます'], 'に行きます'),
        Q('昨日、映画___。', ['を見ました', 'を見ます', 'を見て', 'を見る'], 'を見ました'),
        Q('日本語___話します。', ['を', 'は', 'が', 'で'], 'を'),
        Q('友だち___行きました。', ['と', 'を', 'が', 'は'], 'と'),
        Q('ここ___学校です。', ['は', 'を', 'が', 'に'], 'は'),
        Q('毎朝パン___食べます。', ['を', 'は', 'が', 'に'], 'を'),
        Q('名前は田中___。', ['です', 'ます', 'ました', 'でした'], 'です'),
        Q('水___飲みます。', ['を', 'は', 'が', 'で'], 'を')
    ]],
    'N5|reading': [[
        Q('「わたしは毎朝、七時に起きます。」Когда встаёт этот человек?', ['в семь часов', 'в шесть часов', 'в восемь часов', 'в девять часов'], 'в семь часов'),
        Q('「きのう、ともだちとえいがを見ました。」Что сделал человек вчера?', ['посмотрел фильм', 'купил книгу', 'поел', 'гулял'], 'посмотрел фильм'),
        Q('「このみせはやすいです。」Какой это магазин?', ['дешёвый', 'дорогой', 'большой', 'далеко'], 'дешёвый'),
        Q('「わたしは毎日、学校に行きます。」Куда ходит этот человек каждый день?', ['в школу', 'в магазин', 'в больницу', 'домой'], 'в школу'),
        Q('「田中さんは先生です。」Кто такой Танака?', ['учитель', 'студент', 'врач', 'повар'], 'учитель'),
        Q('「今日は天気がいいです。」Какая сегодня погода?', ['хорошая', 'плохая', 'холодная', 'дождливая'], 'хорошая'),
        Q('「わたしはねこが好きです。」Что любит этот человек?', ['кошек', 'собак', 'рыбу', 'птиц'], 'кошек'),
        Q('「あしたは日曜日です。」Какой завтра день?', ['воскресенье', 'понедельник', 'среда', 'суббота'], 'воскресенье'),
        Q('「ちちは会社に行きます。」Куда ходит отец?', ['на работу', 'в школу', 'в парк', 'домой'], 'на работу'),
        Q('「わたしのへやは広いです。」Какая комната?', ['просторная', 'тёмная', 'маленькая', 'грязная'], 'просторная')
    ]]
};

const BANK2 = {
    'N5|kanji': [
        Q('Как читается 川 (река)?', ['かわ', 'やま', 'もり', 'ひ'], 'かわ'),
        Q('Какое значение у 火?', ['огонь', 'вода', 'дерево', 'земля'], 'огонь'),
        Q('Какое значение у 土?', ['земля', 'камень', 'рис', 'небо'], 'земля'),
        Q('Какое значение у 金?', ['золото, деньги', 'серебро', 'железо', 'медь'], 'золото, деньги'),
        Q('Как читается 手 (рука)?', ['て', 'あし', 'め', 'くち'], 'て'),
        Q('Как читается 足 (нога)?', ['あし', 'て', 'くち', 'みみ'], 'あし'),
        Q('Какое значение у 耳?', ['ухо', 'глаз', 'рот', 'нос'], 'ухо'),
        Q('Какое значение у 中?', ['середина, внутри', 'верх', 'низ', 'край'], 'середина, внутри'),
        Q('Как читается 年 (год)?', ['とし', 'ひ', 'つき', 'かね'], 'とし'),
        Q('Какое значение у 男?', ['мужчина', 'женщина', 'ребёнок', 'старик'], 'мужчина')
    ],
    'N5|grammar': [
        Q('これは私の傘___。', ['です', 'ます', 'でした', 'ました'], 'です'),
        Q('わたしは犬が好き___。', ['です', 'ます', 'ました', 'でしょう'], 'です'),
        Q('毎日、朝ご飯を___。', ['食べます', '食べ', '食べて', '食べた'], '食べます'),
        Q('毎朝、学校へ___。', ['行きます', '行き', '行って', '行った'], '行きます'),
        Q('先生は教室___います。', ['に', 'を', 'が', 'で'], 'に'),
        Q('本___読みます。', ['を', 'は', 'に', 'で'], 'を'),
        Q('きのう、雨___降りました。', ['が', 'を', 'に', 'で'], 'が'),
        Q('東京___住んでいます。', ['に', 'を', 'が', 'へ'], 'に'),
        Q('わたし___学生です。', ['は', 'を', 'が', 'に'], 'は'),
        Q('歩いて学校___行きます。', ['に', 'を', 'が', 'と'], 'に')
    ],
    'N5|reading': [
        Q('「わたしは毎晩、十時に寝ます。」Когда ложится спать этот человек?', ['в десять часов', 'в одиннадцать', 'в девять', 'в восемь'], 'в десять часов'),
        Q('「このかばんは赤いです。」Какого цвета сумка?', ['красная', 'синяя', 'белая', 'чёрная'], 'красная'),
        Q('「きょうは暑いです。」Какая сегодня погода?', ['жаркая', 'холодная', 'дождливая', 'ветреная'], 'жаркая'),
        Q('「わたしは寿司が好きです。」Что любит этот человек?', ['суши', 'пиццу', 'рамен', 'хлеб'], 'суши'),
        Q('「あには大学生です。」Кто такой старший брат?', ['студент университета', 'учитель', 'врач', 'водитель'], 'студент университета'),
        Q('「まいあさ、コーヒーを飲みます。」Что пьёт человек каждое утро?', ['кофе', 'чай', 'воду', 'сок'], 'кофе'),
        Q('「この本はおもしろいです。」Какая книга?', ['интересная', 'скучная', 'старая', 'дорогая'], 'интересная'),
        Q('「ははは料理を作ります。」Что делает мама?', ['готовит еду', 'моет машину', 'читает книгу', 'спит'], 'готовит еду'),
        Q('「駅はどこですか。」Что спрашивает человек?', ['Где станция?', 'Сколько стоит?', 'Который час?', 'Как пройти?'], 'Где станция?'),
        Q('「わたしのいぬは小さいです。」Какая собака?', ['маленькая', 'большая', 'старая', 'быстрая'], 'маленькая')
    ]
};
for (const k in BANK2) { if (BANK[k]) BANK[k].push(BANK2[k]); }

const FREE_TESTS = 2;      // сколько тестов открыто всем в каждом разделе
const TESTS_PER_SECTION = 5; // всего тестов в разделе (остальные — в полном доступе)

const esc = x => String(x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, f) => { const a = n % 10, b = n % 100; return (a === 1 && b !== 11) ? f[0] : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? f[1] : f[2]; };
const sectionKey = (lvl, cat) => `${lvl}|${cat}`;
const isFreeTest = (lvl, cat, n) => n <= FREE_TESTS && !!BANK[sectionKey(lvl, cat)];
const isOpenTest = (lvl, cat, n) => isFreeTest(lvl, cat, n) || owned.includes(lvl);

function theme() { return localStorage.getItem('kanjizen_theme') === 'dark'; }
function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.setItem('kanjizen_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }
if (theme()) document.documentElement.classList.add('dark');

// ----- Список тестов раздела -----
function renderList() {
    const key = sectionKey(activeLevel, activeCat);
    const bank = BANK[key] || [];
    const cards = [];
    for (let n = 1; n <= TESTS_PER_SECTION; n++) {
        const free = isFreeTest(activeLevel, activeCat, n);
        const open = isOpenTest(activeLevel, activeCat, n);
        const hasQ = !!bank[n - 1];
        const stat = (() => {
            const done = localStorage.getItem(`kz_test_${key}_${n}`);
            return done ? JSON.parse(done) : null;
        })();
        if (open && hasQ) {
            cards.push(`
                <button onclick="startTest(${n})" class="test-card group rise text-left glass rounded-3xl p-6 border border-amber-900/10 dark:border-zen-700/60" style="animation-delay:${n * 60}ms">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-[10px] font-black uppercase tracking-[0.2em] px-2.5 py-1 rounded-full bg-amber-200/70 dark:bg-amber-400/15 text-amber-900 dark:text-amber-200">Тест ${n}</span>
                        ${free ? '<span class="text-[10px] font-black uppercase tracking-[0.2em] px-2.5 py-1 rounded-full bg-matcha-200/80 dark:bg-matcha-300/15 text-matcha-800 dark:text-matcha-200">Бесплатно</span>' : ''}
                    </div>
                    <p class="font-black text-xl mb-1">${CAT_NAME[activeCat]} · ${activeLevel}</p>
                    <p class="text-sm text-zen-500 dark:text-zen-300 mb-5">10 вопросов${stat ? ` · лучший результат ${stat.best}/10` : ''}</p>
                    <div class="flex items-center gap-2 text-amber-700 dark:text-amber-400 font-bold text-sm group-hover:gap-3 transition-all">Начать <i class="fa-solid fa-arrow-right text-xs"></i></div>
                </button>`);
        } else {
            cards.push(`
                <div class="test-card locked relative rounded-3xl overflow-hidden glass border border-amber-900/10 dark:border-zen-700/60 rise" style="animation-delay:${n * 60}ms">
                    <div class="p-6 blur-[3px] select-none pointer-events-none">
                        <p class="text-[10px] font-black px-2.5 py-1 rounded-full bg-zen-200/70 dark:bg-zen-800 w-fit mb-4">Тест ${n}</p>
                        <p class="font-black text-xl mb-1">${CAT_NAME[activeCat]} · ${activeLevel}</p>
                        <p class="text-sm mb-5">10 вопросов</p>
                    </div>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-5" style="background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.9))">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-300 to-amber-600 text-zen-900 flex items-center justify-center shadow-lg shadow-amber-500/30 mb-3"><i class="fa-solid fa-lock"></i></div>
                        <p class="font-black">Тест ${n} · полный доступ</p>
                        <p class="text-xs text-zen-500 dark:text-zen-300 mt-1">Откроется после оформления подписки</p>
                    </div>
                </div>`);
        }
    }
    view.innerHTML = `<div class="grid sm:grid-cols-2 gap-5">${cards.join('')}</div>`;
    syncChrome();
}

function syncChrome() {
    document.querySelectorAll('.lvl-btn').forEach(b => b.classList.toggle('text-zen-900', b.dataset.lvl === activeLevel));
    document.querySelectorAll('.cat-btn').forEach(b => {
        const on = b.dataset.cat === activeCat;
        b.className = 'cat-btn h-10 px-4 rounded-2xl border text-sm font-bold flex items-center gap-2 transition-all ' + (on
            ? 'border-amber-400 bg-gradient-to-r from-amber-300 to-amber-500 text-zen-900 shadow-lg shadow-amber-500/30'
            : 'border-amber-900/15 dark:border-zen-700 bg-white/50 dark:bg-zen-900/50 text-zen-600 dark:text-zen-300 hover:border-amber-400');
    });
    const b = document.querySelector(`.lvl-btn[data-lvl="${activeLevel}"]`), g = document.getElementById('lvl-glider');
    if (b && g) { g.style.left = b.offsetLeft + 'px'; g.style.width = b.offsetWidth + 'px'; }
}

// ----- Прохождение теста -----
function startTest(n) {
    const qs = BANK[sectionKey(activeLevel, activeCat)][n - 1];
    run = { n, qs, i: 0, score: 0, sel: null, checked: false, answers: [] };
    renderRun(true);
}
function renderRun(enter) {
    const q = run.qs[run.i];
    const dots = run.qs.map((_, k) => {
        const st = run.answers[k];
        const c = st === undefined ? (k === run.i ? 'bg-amber-400 scale-125' : 'bg-amber-900/15 dark:bg-zen-700') : (st ? 'bg-matcha-500' : 'bg-amber-700');
        return `<span class="dot w-2.5 h-2.5 rounded-full ${c}"></span>`;
    }).join('');
    const opts = q.o.map((o, k) => {
        let cls = 'opt flex items-center gap-3 p-4 rounded-2xl border border-amber-900/10 dark:border-zen-700 bg-white/70 dark:bg-zen-900/60 text-left';
        if (run.checked) { if (o === q.a) cls += ' right'; else if (o === run.sel) cls += ' wrong'; }
        else if (run.sel === o) cls += ' sel';
        return `<button ${run.checked ? 'disabled' : ''} onclick="pickOpt(event, '${esc(o).replace(/'/g, '&#39;')}')" class="${cls}">
            <span class="w-9 h-9 shrink-0 rounded-xl bg-amber-100/80 dark:bg-zen-800 text-amber-800 dark:text-amber-300 text-xs font-black flex items-center justify-center">${'АБВГ'[k]}</span>
            <span class="font-jp text-lg font-semibold">${esc(o)}</span>
            ${run.checked && o === q.a ? '<svg class="ml-auto w-5 h-5" viewBox="0 0 24 24"><path class="check-draw" d="M4 12.5l5 5L20 6.5" fill="none" stroke="#5f7d35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
        </button>`;
    }).join('');
    const foot = run.checked
        ? `<div class="verdict flex-1 text-sm font-bold ${run.sel === q.a ? 'text-matcha-700 dark:text-matcha-300' : 'text-amber-800 dark:text-amber-300'}">${run.sel === q.a ? 'Верно!' : 'Правильно: ' + esc(q.a)}</div>
           <button onclick="nextQ()" class="px-6 h-11 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold shadow-lg shadow-amber-600/30 hover:scale-[1.02] transition-transform">${run.i === run.qs.length - 1 ? 'Итог' : 'Далее'} <i class="fa-solid fa-arrow-right ml-1 text-xs"></i></button>`
        : `<button onclick="checkQ()" class="px-6 h-11 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold shadow-lg shadow-amber-600/30 transition-all ${run.sel ? '' : 'opacity-50 pointer-events-none'}">Проверить</button><span class="text-xs text-zen-400">Клавиши 1–4 и Enter</span>`;
    view.innerHTML = `
        <div class="${enter ? 'rise' : ''}">
            <div class="flex items-center justify-between mb-5">
                <button onclick="exitRun()" class="h-10 px-4 rounded-xl border border-amber-900/15 dark:border-zen-700 text-sm font-semibold hover:border-amber-400 transition-colors"><i class="fa-solid fa-xmark mr-1 text-xs"></i>Выйти</button>
                <p class="text-sm font-bold text-zen-500 dark:text-zen-300">Тест ${run.n} · ${CAT_NAME[activeCat]} · ${activeLevel}</p>
            </div>
            <div class="flex items-center justify-center gap-2 mb-6">${dots}</div>
            <div class="q-in glass rounded-3xl p-6 md:p-8 border border-amber-900/10 dark:border-zen-700/60">
                <p class="text-xs font-black uppercase tracking-[0.2em] text-amber-700 dark:text-amber-400 mb-3">Вопрос ${run.i + 1} из ${run.qs.length}</p>
                <h2 class="text-xl md:text-2xl font-bold leading-relaxed mb-7">${qHtml(q.q)}</h2>
                <div class="grid sm:grid-cols-2 gap-3">${opts}</div>
                <div class="mt-6 flex items-center gap-4 min-h-[44px]">${foot}</div>
            </div>
        </div>`;
}
function qHtml(text) {
    const m = String(text).match(/「([\s\S]*?)」/);
    if (m) return `<span class="block font-jp text-lg md:text-xl leading-loose text-zen-900 dark:text-amber-50 mb-3 p-4 rounded-2xl bg-amber-50/80 dark:bg-amber-400/10 border border-amber-200/70 dark:border-amber-500/20">${esc(m[1])}</span>${esc(text.replace(m[0], '').trim())}`;
    return text.includes('___') ? esc(text).replace('___', '<span class="inline-block mx-1 px-3 border-b-4 border-amber-400 text-amber-600 dark:text-amber-300">&nbsp;&nbsp;&nbsp;&nbsp;</span>') : esc(text);
}
function pickOpt(ev, o) {
    if (run.checked) return;
    run.sel = o;
    const btn = ev.currentTarget, r = btn.getBoundingClientRect(), size = Math.max(r.width, r.height);
    const d = document.createElement('span'); d.className = 'ripple';
    d.style.width = d.style.height = size + 'px';
    d.style.left = (ev.clientX - r.left - size / 2) + 'px'; d.style.top = (ev.clientY - r.top - size / 2) + 'px';
    btn.appendChild(d); setTimeout(() => d.remove(), 650);
    renderRun(false);
}
function checkQ() {
    if (!run.sel || run.checked) return;
    run.checked = true;
    const ok = run.sel === run.qs[run.i].a;
    run.answers[run.i] = ok;
    if (ok) { run.score++; burst(); }
    renderRun(false);
}
function nextQ() {
    if (run.i < run.qs.length - 1) { run.i++; run.sel = null; run.checked = false; renderRun(true); }
    else finishRun();
}
function finishRun() {
    const key = sectionKey(activeLevel, activeCat);
    const prev = JSON.parse(localStorage.getItem(`kz_test_${key}_${run.n}`) || 'null');
    const best = Math.max(run.score, prev ? prev.best : 0);
    localStorage.setItem(`kz_test_${key}_${run.n}`, JSON.stringify({ best }));
    const pct = Math.round(run.score / run.qs.length * 100);
    const great = run.score >= 8;
    view.innerHTML = `
        <div class="rise glass rounded-3xl p-8 md:p-10 border border-amber-900/10 dark:border-zen-700/60 text-center">
            <div class="relative w-40 h-40 mx-auto mb-6">
                <svg viewBox="0 0 36 36" class="w-40 h-40 -rotate-90"><circle cx="18" cy="18" r="15.5" fill="none" stroke="currentColor" class="text-amber-900/10 dark:text-zen-700" stroke-width="2.4"/><circle class="ring" cx="18" cy="18" r="15.5" fill="none" stroke="${great ? '#7a9c4a' : '#f59e0b'}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"/></svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <p class="text-4xl font-black">${run.score}<span class="text-lg text-zen-400">/10</span></p>
                    <p class="text-xs uppercase tracking-widest text-zen-400">${pct}%</p>
                </div>
            </div>
            <p class="gold-text text-3xl font-black font-jp mb-2">${great ? 'すごい！' : 'がんばって！'}</p>
            <p class="text-zen-500 dark:text-zen-300 mb-7">${great ? 'Отличный результат. Вы хорошо знаете материал.' : 'Повторите вопросы с ошибками и попробуйте ещё раз.'}</p>
            <div class="flex items-center justify-center gap-3 flex-wrap">
                <button onclick="startTest(${run.n})" class="px-6 h-12 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-white font-bold shadow-lg shadow-amber-600/30 hover:scale-[1.02] transition-transform">Пройти ещё раз</button>
                <button onclick="exitRun()" class="px-6 h-12 rounded-2xl border border-amber-900/15 dark:border-zen-700 font-bold hover:border-amber-400 transition-colors">К тестам</button>
            </div>
        </div>`;
    setTimeout(() => {
        const c = document.querySelector('circle.ring');
        if (c) c.style.strokeDashoffset = String(97.4 * (1 - run.score / run.qs.length));
    }, 60);
    if (great) for (let i = 0; i < 2; i++) setTimeout(burst, 200 + i * 250);
    run = null;
}
function exitRun() { run = null; renderList(); }

function burst() {
    const glyphs = ['正', '良', '完', '花', '光', '星'];
    const colors = ['#f59e0b', '#fbbf24', '#7a9c4a', '#fde68a'];
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.textContent = glyphs[i % glyphs.length];
        const ang = (Math.PI * 2 * i) / 12, dist = 60 + Math.random() * 60;
        p.style.left = '50%'; p.style.top = '45%';
        p.style.fontSize = (14 + Math.random() * 12) + 'px';
        p.style.color = colors[i % colors.length];
        p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        p.style.setProperty('--rot', (Math.random() * 200 - 100) + 'deg');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1600);
    }
}

// ----- Управление -----
document.querySelectorAll('.lvl-btn').forEach(b => b.addEventListener('click', () => { activeLevel = b.dataset.lvl; run = null; renderList(); }));
document.querySelectorAll('.cat-btn').forEach(b => b.addEventListener('click', () => { activeCat = b.dataset.cat; run = null; renderList(); }));
window.addEventListener('resize', syncChrome);
document.addEventListener('keydown', e => {
    if (!run || e.target.tagName === 'INPUT') return;
    if (['1', '2', '3', '4'].includes(e.key) && !run.checked) pickOpt({ currentTarget: document.querySelectorAll('#view .opt')[Number(e.key) - 1] || { getBoundingClientRect: () => ({ left: 0, top: 0, width: 0, height: 0 }) }, clientX: 0, clientY: 0 }, run.qs[run.i].o[Number(e.key) - 1]);
    if (e.key === 'Enter') { if (!run.checked) checkQ(); else nextQ(); }
});

(async function init() {
    try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            const { data } = await sb.from('purchases').select('level');
            owned = (data || []).map(x => x.level);
        }
    } catch (e) { owned = []; }
    renderList();
})();
</script>
</body>
</html>
